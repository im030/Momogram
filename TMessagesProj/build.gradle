android {
    compileSdkVersion 36
    buildToolsVersion '36.0.0'
    ndkVersion = rootProject.ext.ndkVersion


    packagingOptions {
        jniLibs {
            excludes += ['/fabric/**', '/META-INF/native-image/**']
            pickFirsts += ['**/libtmessages.*.so']
        }
        resources {
            excludes += ['/fabric/**', '/META-INF/*.version', '/META-INF/*.kotlin_module', '/META-INF/native-image/**', '/builddef.lst', '/*.txt', '/DebugProbesKt.bin', '/okhttp3/internal/publicsuffix/NOTICE', '/META-INF/INDEX.LIST']
        }
    }
    lint {
        disable 'MissingTranslation', 'ExtraTranslation', 'BlockedPrivateApi', 'Instantiatable'
    }

    tasks.all { task ->
        if (task.name.startsWith("uploadCrashlyticsMappingFile")) {
            task.enabled = false
        } else if (task.name.contains("Crashlytics")) {
            task.enabled = false
        } else if (task.name.endsWith("GoogleServices")) {
            task.enabled = false
        }
    }

    lintOptions {
        disable 'MissingTranslation'
        disable 'ExtraTranslation'
        disable 'BlockedPrivateApi'
    }

    namespace = 'org.telegram.messenger'
}
