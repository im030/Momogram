import java.nio.charset.StandardCharsets

apply plugin: "com.android.application"
apply plugin: "kotlin-android"
apply plugin: "org.telegram.build-plugin"
apply plugin: "org.telegram.build-app-plugin"

def verName = APP_VERSION_NAME
def verCode = 11549

def gitHashProc = new ProcessBuilder("git", "log", "--pretty=format:'%h'", "-n", "1").redirectErrorStream(true).start()
def gitHashBuf = new byte[16]
gitHashProc.getInputStream().read(gitHashBuf)
def gitHash = new String(gitHashBuf, StandardCharsets.UTF_8).trim().replace('\'','')

verName += "-" + gitHash
println(gitHash)

def archs = List.of("arm64-v8a", "armeabi-v7a", "x86", "x86_64")

def officialVer = APP_VERSION_NAME
def officialCode = APP_VERSION_CODE

def serviceAccountCredentialsFile = rootProject.file("service_account_credentials.json")

def beta = verName.contains("preview")

if (serviceAccountCredentialsFile.isFile()) {
    setupPlay(beta)
    play.serviceAccountCredentials = serviceAccountCredentialsFile
} else if (System.getenv().containsKey("ANDROID_PUBLISHER_CREDENTIALS")) {
    setupPlay(beta)
}

void setupPlay(boolean beta) {
    apply plugin: "com.github.triplet.play"
    play {
        track = beta ? "beta" : "production"
        defaultToAppBundles = true
    }
}

